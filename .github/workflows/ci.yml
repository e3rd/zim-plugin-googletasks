name: CI

on:
  push:
    branches: ['**']  # tags run the suite through release.yml, which waits for it
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Zim, GTK and the Google libraries are stubbed by tests/conftest.py, only dateutil is real
      - run: pip install pytest ruff python-dateutil
      - run: ruff check .
      - run: pytest
