# Pushed tag (make release) → tests → GitHub release with the notes from CHANGELOG.md.
# Not a package, nothing to publish: the release is just the notification and the downloadable sources.
name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Release only what passes the suite on the very tagged commit (the release commit itself never had a CI run before).
  tests:
    uses: ./.github/workflows/ci.yml
  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - name: Take the notes from the CHANGELOG section of the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '/^# /{found = ($2 == tag); next} found' CHANGELOG.md > notes.md
          grep -q "[^[:space:]]" notes.md || { echo "::error::no section '# $TAG' in CHANGELOG.md"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --verify-tag --notes-file notes.md
