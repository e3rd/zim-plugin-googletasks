# Only tool configuration (ruff, pytest, bump-my-version) - this project is not a package, see install.py for deployment.

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["starsi", ".vscode"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"bin/insert_note.py" = ["E402"]  # must tweak warnings/sys.path before importing zim

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "_lib"]

# Releasing: make release PART=patch|minor|major, see Makefile. The version lives in CHANGELOG.md only.
[tool.bumpversion]
current_version = "1.2"
# Historical versions have two parts (1.0, 1.1), a zero patch is not written out.
parse = '(?P<major>\d+)\.(?P<minor>\d+)(\.(?P<patch>\d+))?'
serialize = ["{major}.{minor}.{patch}", "{major}.{minor}"]
commit = true
tag = true
tag_name = "{new_version}"
tag_message = "{new_version}"
message = "chore(release): {new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "# Unreleased"
replace = "# {new_version} ({now:%Y-%m-%d})"
